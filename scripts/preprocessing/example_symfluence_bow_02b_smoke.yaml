# Minimal semidistributed Bow River smoke configuration for native
# SYMFLUENCE NGEN / Noah-OWP preprocessing
# It keeps the time range short but runs through model-specific preprocessing
# so SYMFLUENCE writes per-catchment forcing CSVs and Noah inputs

# Use the shared SYMFLUENCE data root outside this repository
SYMFLUENCE_DATA_DIR: "../SYMFLUENCE_data"

# Installed package location for the preprocessing virtual environment
SYMFLUENCE_CODE_DIR: "./scripts/preprocessing/.venv/lib/python3.12/site-packages/symfluence"

DOMAIN_NAME: "Bow_02b_semidistributed_smoke"
EXPERIMENT_ID: "smoke_01"

# Short range for smoke testing
EXPERIMENT_TIME_START: "2004-01-01 01:00"
EXPERIMENT_TIME_END: "2004-01-03 23:00"

# Bow River at Banff reference domain, adapted to semidistributed mode
POUR_POINT_COORDS: "51.1722/-115.5717"
BOUNDING_BOX_COORDS: "51.76/-116.55/50.95/-115.5"
DOMAIN_DEFINITION_METHOD: "semidistributed"
SUB_GRID_DISCRETIZATION: "GRUS"
GEOFABRIC_TYPE: "TDX"
DELINEATION_METHOD: "stream_threshold"
STREAM_THRESHOLD: 2500
DELINEATE_BY_POURPOINT: true
MOVE_OUTLETS_MAX_DISTANCE: 200
MIN_GRU_SIZE: 0
MIN_HRU_SIZE: 4

# ERA5 supplies the forcing fields used by the NGEN / Noah path
FORCING_DATASET: "ERA5"
FORCING_VARIABLES: "default"
FORCING_TIME_STEP_SIZE: 3600
APPLY_LAPSE_RATE: true

# Use SYMFLUENCE's native NGEN preprocessing for Noah-OWP only
HYDROLOGICAL_MODEL: "NGEN"
NGEN_MODULES_SELECTED: "NOAH"
NGEN_MODULES_TO_CALIBRATE: "NOAH"

# MIAOW stages Noah-OWP inputs with upstream standalone-style model options
MIAOW_STAGING:
  noah_overrides:
    model_options:
      precip_phase_option: 1
      snow_albedo_option: 1
      dynamic_veg_option: 1
      runoff_option: 8
      drainage_option: 8
      frozen_soil_option: 1
      dynamic_vic_option: 1
      radiative_transfer_option: 3
      sfc_drag_coeff_option: 1
      canopy_stom_resist_option: 1
      crop_model_option: 0
      snowsoil_temp_time_option: 3
      soil_temp_boundary_option: 2
      supercooled_water_option: 1
      stomatal_resistance_option: 1
      evap_srfc_resistance_option: 1
      subsurface_option: 1

# Feature IDs for exported CSV filenames come from the generated catchment layer
CATCHMENT_SHP_HRUID: "HRU_ID"
